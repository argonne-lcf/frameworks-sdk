---
name: test-report

# Renders the ALCF GitLab test results on GitHub as a check run and artifacts.
on:
  repository_dispatch:
    types:
      - test-report

permissions:
  # contents is for the checkout; listing any permission zeroes the rest
  checks: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # repository_dispatch runs from the default branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Report the results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python3 tools/github-report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # runs even if the step above failed; the dispatch drops oversized reports
        if: always()
        with:
          name: junit-reports
          path: "*.xml"
          if-no-files-found: warn
